<svg xmlns="http://www.w3.org/2000/svg" width="900" height="459" viewBox="0 0 900 459" role="img" aria-label="Khushi, Dev Dashboard. B.Tech CSE, Chitkara University, Chandigarh, India. Building things on the web, one soft pixel at a time.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a98bea"/><stop offset=".22" stop-color="#7a52c9"/><stop offset=".5" stop-color="#30194f"/><stop offset="1" stop-color="#0e0919"/></linearGradient>
<radialGradient id="glow" cx=".3" cy=".05" r=".7"><stop offset="0" stop-color="#e6d8ff" stop-opacity=".45"/><stop offset="1" stop-color="#e6d8ff" stop-opacity="0"/></radialGradient>
<pattern id="dw" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#f6f2ff"/></pattern>
<pattern id="dt" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#eadfff"/></pattern>
<linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17141f"/><stop offset="1" stop-color="#17141f" stop-opacity="0"/></linearGradient>
